[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myrecorder"
version = "0.2.0"
description = "Async RTSP to HLS recorder with detection-server AI trigger"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "slack-sdk>=3.27",
]

[project.scripts]
myrecorder = "myrecorder.app:main"
