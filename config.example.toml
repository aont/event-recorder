[paths]
# Relative paths are resolved relative to this TOML file.
source_hls_dir = "source-hls"
recordings_dir = "recordings"
frame_storage_dir = "frames"

[rtsp]
url = "rtsp://example.local/stream"
transport = "tcp"
input_args = []

[hls]
ffmpeg_bin = "ffmpeg"
restart_sleep_seconds = 5.0

[frames]
# Tc: extract one frame every this many seconds from each segment.
tc_seconds = 1.0
# Tb: keep/extend recording until frame timestamp + this many seconds after a target detection.
tb_seconds = 10.0
jpeg_quality = 3
save_frames = false
delete_frames_for_deleted_segments = true
skip_existing_segments_on_start = false

[ai]
server_url = "http://127.0.0.1:8080"
# unix_socket_path = "/tmp/detection-server.sock"
target_objects = ["cat"]
score_threshold = 0.4
timeout_seconds = 20.0
max_results = -1

[slack]
enabled = false
title_prefix = "Recording"
initial_comment = ""
bot_token = ""
channel_id = ""
